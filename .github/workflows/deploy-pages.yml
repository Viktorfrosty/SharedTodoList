name: Deploy Blazor app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Publish Blazor WebAssembly
        run: dotnet publish SharedTodoList.csproj --configuration Release --output publish

      - name: Configure Firebase client settings
        env:
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          values = {
              "apiKey": os.environ.get("FIREBASE_API_KEY", ""),
              "authDomain": os.environ.get("FIREBASE_AUTH_DOMAIN", ""),
              "projectId": os.environ.get("FIREBASE_PROJECT_ID", ""),
              "appId": os.environ.get("FIREBASE_APP_ID", ""),
          }
          configured = [bool(value) for value in values.values()]
          if any(configured) and not all(configured):
              raise SystemExit("Set all four Firebase repository variables, or leave all four unset.")
          if all(configured):
              output = Path("publish/wwwroot/firebase-config.local.js")
              output.write_text(
                  "export const firebaseConfig = "
                  + json.dumps(values, separators=(",", ":"))
                  + ";\n",
                  encoding="utf-8",
              )
          PY

      - name: Set project-site base path
        run: |
          sed -i 's|<base href="/" />|<base href="/${{ github.event.repository.name }}/" />|' publish/wwwroot/index.html
          touch publish/wwwroot/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
